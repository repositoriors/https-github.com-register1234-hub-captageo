<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>CaptaGeo | Materiais da proposta</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #102d3e;
      --blue: #159dcc;
      --soft: #e9f8fd;
      --line: #b7ddea;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--ink);
      background: #f7fbfd;
    }
    main {
      width: min(720px, 100%);
      padding: 42px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(16, 45, 62, .08);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: flex-start;
      width: auto;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .brand img {
      width: 210px;
      height: auto;
      display: block;
    }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); }
    .intro { margin: 16px 0 30px; line-height: 1.6; color: #49616f; }
    .links { display: grid; gap: 14px; }
    a {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 18px 20px;
      border: 1px solid var(--line);
      border-radius: 14px;
      color: var(--ink);
      background: var(--soft);
      font-weight: 700;
      text-decoration: none;
    }
    a:hover, a:focus-visible { border-color: var(--blue); }
    small { display: block; margin-top: 28px; color: #6d818c; line-height: 1.5; }
    @media (max-width: 560px) { main { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main>
    <a class="brand" href="/" aria-label="Voltar à página inicial da CaptaGeo">
      <img src="/acesso/sergipetec-2026-cg7m4q9x2p6n/captageo-logo.webp" alt="CaptaGeo">
    </a>
    <p class="eyebrow">Acesso reservado</p>
    <p class="intro">Materiais preparados para avaliação da proposta de incubação no SergipeTec.</p>
    <div class="links">
      <a href="/acesso/sergipetec-2026-cg7m4q9x2p6n/pitch">Pitch da proposta <span>PDF</span></a>
      <a href="/acesso/sergipetec-2026-cg7m4q9x2p6n/canvas">Business Model Canvas <span>PDF</span></a>
      <a href="/acesso/sergipetec-2026-cg7m4q9x2p6n/equipe">Planilha da equipe <span>XLSX</span></a>
    </div>
    <small>Este endereço não aparece nos menus públicos da CaptaGeo e foi configurado para não ser indexado por mecanismos de busca.</small>
  </main>
</body>
</html>
